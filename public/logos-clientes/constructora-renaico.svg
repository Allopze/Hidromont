<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <!-- Definition of fonts / styles -->
  <defs>
    <linearGradient id="renaicoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="renaicoSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Architectural / Structural Mark -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main Foundation Plate -->
      <path d="M 10 90 L 90 90" stroke="url(#renaicoSlate)" stroke-width="4" />
      
      <!-- Structural R shape (composed of steel beams) -->
      <!-- Vertical main post -->
      <path d="M 30 90 L 30 20" stroke="url(#renaicoSlate)" stroke-width="7" />
      
      <!-- Curve of the R / Arch shape -->
      <path d="M 30 20 L 60 20 C 75 20, 75 52, 60 52 L 30 52" stroke="url(#renaicoSlate)" stroke-width="7" />
      
      <!-- Truss/Brace leg -->
      <path d="M 50 52 L 78 90" stroke="url(#renaicoSlate)" stroke-width="7" />
      
      <!-- Dynamic orange Arch/Cúpula element representing civil engineering -->
      <path d="M 22 90 C 22 35, 88 35, 88 90" stroke="url(#renaicoOrange)" stroke-width="5" />
      
      <!-- Subtle internal structural web members (orange) -->
      <path d="M 30 36 L 48 20" stroke="url(#renaicoOrange)" stroke-width="3" />
      <path d="M 30 72 L 48 52" stroke="url(#renaicoOrange)" stroke-width="3" />
      <path d="M 48 52 L 64 72" stroke="url(#renaicoOrange)" stroke-width="3" />
    </g>

    <!-- Company Name Typography -->
    <!-- Constructora -->
    <text x="115" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#64748b" letter-spacing="2">CONSTRUCTORA</text>
    <!-- Renaico SpA -->
    <text x="115" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#1e293b" letter-spacing="1">RENAICO <tspan fill="#ea580c" font-weight="800">SPA</tspan></text>
  </g>
</svg>
