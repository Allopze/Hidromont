# A4-001: CI bloqueante. Ejecuta build, type-check, tests unitarios y el gate
# anti-overlay (H1) en cada PR y push. El job e2e-full corre los tests que requieren
# los servidores Astro+CMS levantados.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Unit tests + Build gate (H1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # H1: el build de producción DEBE generarse con PUBLIC_ENABLE_CMS=0 para que el
      # dist/ no incluya el overlay del CMS. El gate e2e lo verifica.
      PUBLIC_ENABLE_CMS: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # NODE_ENV=production va solo acá y no a nivel de job: en el job, `npm ci`
      # lo lee y omite las devDependencies, así que husky (el script `prepare`)
      # no se instalaba y el install moría con "husky: not found" (exit 127).
      # Astro, vitest y eslint también son devDependencies.
      - name: Type-check + Build (astro check && astro build)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Unit tests (vitest)
        run: npm test

      # Perfil público: PUBLIC_ENABLE_CMS=0 a nivel de job, así que aquí el
      # gate exige que el overlay no aparezca por ningún lado.
      - name: Build gate — perfil público (sin overlay)
        run: npx playwright test --project=chromium e2e/build-gate.spec.ts

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e-full:
    name: E2E (Astro + CMS servers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # E2E full requiere el overlay activo para probar el flujo del editor y
      # que el dist/ que sirve el CMS del sandbox sea el perfil de producción.
      PUBLIC_ENABLE_CMS: '1'
      # Credenciales solo del sandbox: el CMS de pruebas corre en localhost con
      # NODE_ENV=test y una base nueva sembrada al arrancar (cms/data/ no está
      # en git; ver scripts/e2e-cms-sandbox.mjs).
      CMS_ADMIN_EMAIL: admin@hidromont.local
      CMS_ADMIN_PASSWORD: Hidromont-Admin-ChangeMe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (with overlay)
        run: npm run build

      # P1-09 (auditoría 2026-09): antes este job arrancaba el CMS y el preview
      # a mano en 127.0.0.1 mientras playwright.config.ts levantaba los suyos
      # con reuseExistingServer:false: chocaban por los puertos y la config
      # rechazaba 127.0.0.1. Ahora Playwright levanta el dev server y el CMS del
      # sandbox (que sirve este dist/ para csp.spec y build-gate).
      - name: Run E2E tests (incluye el build gate del perfil con CMS)
        run: npx playwright test --project=chromium

      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: test-results/
          retention-days: 7
